[package]
name = "cae-cli"
version = "0.1.0"
edition = "2021"
description = "Career Asset Engine standalone CLI - tracks projects, manifests, agent context, and commits"

[[bin]]
name = "cae"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
colored = "2.1"
dirs = "5.0"
sha2 = "0.10"
hex = "0.4"
walkdir = "2.5"
anyhow = "1.0"
